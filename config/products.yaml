# =============================================================================
# PRODUCT CATALOG
# =============================================================================
# Every product a takeoff can use. Edit this file to add products or fix sizes;
# no code changes needed.
#
# Fields
#   code          Short code used in buildups (e.g. FIT70). Must be unique.
#   display       Name printed on the drawing (BOM, callouts, notes).
#   family        Drives the rules. One of:
#                   xfit, fit_tile, fit_roll, flooring, rst, dh, ff, ff_panel,
#                   system, pmi, plywood, concrete, finished_floor, other
#   unit          tile | roll | panel | sheet | lf_roll   (what we count in the BOM)
#   unit_size     SF per tile/roll/panel, or LF per roll for lf_roll.
#                 null = not known yet -> the engine stops with a clear error.
#   thickness_mm  Used for buildup heights and ramp planning.
#   adhesive      Adhesive class (see adhesives.yaml): fit70, fit30, rolled,
#                 turf, plank, none, pending (calculator not supplied yet)
#   bond          glued | loose   How this layer normally attaches to the
#                 layer below. A buildup can override this per layer.
#   nbn           true for "No Bond Needed" products (FFxxNBN).
#   in_bom        false for things Pliteq never supplies (plywood, concrete, finished floor).
#   plies         a product made of N layers of a thinner one, glued to each other
#                 (FFNC50NBN = 2 x FFNC25NBN). Adhesive is counted for every ply.
#   components    a system made of other products, top first (FIT62 = FIT30 on FFNC32).
#                 The BOM lists the components (or the system itself with bom: system);
#                 adhesive is always worked out per component; the callout shows the system name.
#   count         sf = the BOM line shows square feet only, no roll/tile count (Envy, PeakForce).
#   sf_multiple   SF (after overage) rounded up to a multiple of this, then down to 0.1 SF:
#                 ROUNDDOWN(CEILING(SF, 8*(8/12)*(59.8/12)), 1). 8*(8/12)*(59.8/12) = 26.5778.
#   hatch_pattern CAD hatch pattern name (e.g. DOLMIT, BRICK).
#   hatch_scale   CAD hatch scale factor (e.g. 32).
#
# Items marked TODO need a value from Pliteq.
# =============================================================================

products:

  # ---- xFIT (above FIT in the BOM, thickest first) -------------------------
  - {code: xFIT100, display: GenieMat xFIT100, family: xfit, unit: tile, unit_size: 4, thickness_mm: 100, adhesive: pending, bond: glued}  # 4 SF per tile, 100mm tall (confirmed by Pliteq); TODO calculator
